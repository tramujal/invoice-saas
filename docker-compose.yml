# Local Docker Compose stack: Postgres + backend + frontend, plus an
# optional, experimental whatsapp-bridge service (Phase 23, disabled by
# default -- see the `whatsapp` profile below and docs/whatsapp.md).
#
# `docker compose up --build` works with no .env file at all -- every value
# below is a safe local default. Container-internal values (the Postgres
# URL, service hostnames) are hardcoded as literal `environment:` values,
# not ${VAR} substitution: Compose auto-loads a file literally named `.env`
# next to this file unconditionally, and a developer who previously ran the
# existing non-Docker setup (`cp .env.example .env`, SQLite-flavored
# DATABASE_URL) would otherwise have that value silently win over the
# Postgres URL this stack actually needs. ${VAR:-} substitution is used only
# for genuinely optional overrides (AI/email keys), where "unset" is already
# a safe, supported app state -- see .env.docker.example.
#
# This is purely additive: it does not change the existing Render/Vercel/
# Neon deployment (render.yaml is untouched) or the existing non-Docker
# local dev flow (SQLite via `uvicorn --reload` / `npm run dev`).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicing
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published for local debugging (psql, a GUI client) -- remove if
      # you don't need host-side access to this database.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing -d invoicing"]
      # Explicit (not bare-default) tuning: the official postgres image
      # runs a temporary internal instance during first-run initdb before
      # its real restart, and a naive healthcheck can briefly report ready
      # against that transient instance.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://invoicing:invoicing_local_dev@db:5432/invoicing
      # Local reproducibility, not a production deploy -- ENVIRONMENT=production
      # would make JWT_SECRET_KEY import-time-fatal if unset and disable the
      # AI_MODEL dev fallback, adding friction to a bare `docker compose up`.
      ENVIRONMENT: development
      JWT_SECRET_KEY: local-docker-dev-secret-change-me
      # No reverse proxy exists in this topology (browser -> host-mapped
      # port -> container directly) -- 0 matches local dev exactly.
      TRUSTED_PROXY_HOPS: "0"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_BASE_URL: http://localhost:3000
      # Optional providers -- safely unset by default; the app starts fine
      # and only 503s lazily if an endpoint that needs one is actually
      # called. Set these in a .env file (copy .env.docker.example) to
      # enable real email/AI locally.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Experimental WhatsApp assistant (Phase 23, see docs/whatsapp.md) --
      # unset/false by default, same "app starts and functions normally
      # without it" contract as every other optional provider above. Only
      # meaningful together with the `whatsapp` profile's whatsapp-bridge
      # service below; WHATSAPP_BRIDGE_SECRET must be the exact same value
      # on both services (it's how the two authenticate to each other).
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-null}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3100}
      WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:-}
    ports:
      - "8000:8000"
    restart: on-failure

  # Experimental, UNOFFICIAL WhatsApp Web transport bridge (Phase 23) --
  # see docs/whatsapp.md. Excluded from a bare `docker compose up`; start
  # it explicitly with `docker compose --profile whatsapp up --build`, and
  # only after setting WHATSAPP_ENABLED=true, WHATSAPP_PROVIDER=bridge, and
  # a real WHATSAPP_BRIDGE_SECRET (matching the `backend` service above) in
  # your `.env` file. Needs a real Chromium runtime and a persistent
  # process/volume -- this is why it is its own container instead of
  # running inside `backend`, and why it cannot run on a serverless host.
  whatsapp-bridge:
    profiles: ["whatsapp"]
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3100"
      BACKEND_BASE_URL: http://backend:8000
      WHATSAPP_BRIDGE_SECRET: ${WHATSAPP_BRIDGE_SECRET:-}
      WHATSAPP_SESSION_PATH: /app/.wwebjs_auth
      SIGNATURE_TOLERANCE_SECONDS: ${WHATSAPP_SIGNATURE_TOLERANCE_SECONDS:-300}
      BACKEND_REQUEST_TIMEOUT_SECONDS: "10"
      RECONNECT_INITIAL_DELAY_SECONDS: "5"
      RECONNECT_MAX_DELAY_SECONDS: "300"
      RECONNECT_MAX_ATTEMPTS: "20"
    volumes:
      # Session data is equivalent to full WhatsApp account access if it
      # leaks -- a named volume (not a bind mount) keeps it out of the
      # repo working tree entirely. Deleting this volume is the container
      # equivalent of Settings -> WhatsApp's "Delete session" action.
      - whatsapp_session:/app/.wwebjs_auth
    restart: on-failure

  # Durable background-job worker (Phase 15C) -- a genuinely separate
  # container from `backend`, matching this app's real deployment shape
  # (see render.yaml's commented `worker` service block): the web process
  # never claims or executes jobs itself. Shares the SAME database as
  # `backend` (not a separate one), since the job queue lives in the same
  # Postgres instance -- see app.services.background_jobs's own docstring
  # on why a database-backed queue was chosen over a separate broker.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://invoicing:invoicing_local_dev@db:5432/invoicing
      ENVIRONMENT: development
      JWT_SECRET_KEY: local-docker-dev-secret-change-me
      TRUSTED_PROXY_HOPS: "0"
      WORKER_QUEUE: default
      WORKER_POLL_INTERVAL_SECONDS: "2"
      WORKER_IDLE_BACKOFF_MAX_SECONDS: "10"
      WORKER_LEASE_DURATION_SECONDS: "300"
      WORKER_BATCH_SIZE: "5"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time -- must be the URL the
        # browser can reach (the host-mapped backend port), never the
        # Docker-internal "backend" hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    # No runtime `environment:` needed here -- NEXT_PUBLIC_API_URL is
    # build-time only (see frontend/Dockerfile); setting it here would have
    # no effect on the already-built pages.
    ports:
      - "3000:3000"
    restart: on-failure

volumes:
  pgdata:
  whatsapp_session:
