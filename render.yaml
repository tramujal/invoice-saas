# Render Blueprint for the FastAPI backend.
# https://render.com/docs/blueprint-spec
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo. Render will read this file and create the service below. Env vars
# marked `sync: false` are left empty for you to fill in from the dashboard —
# they are never stored in this file or the repo.

services:
  - type: web
    name: invoicing-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips="" disables uvicorn's OWN built-in X-Forwarded-For
    # trust (its ProxyHeadersMiddleware trusts 127.0.0.1 by default, and would
    # rewrite request.client.host from X-Forwarded-For independently of --
    # and before -- app.rate_limit's own TRUSTED_PROXY_HOPS check below,
    # which is meant to be the *only* place that header is ever interpreted.
    # See the "IMPORTANT" note in app/rate_limit.py's module docstring.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips=

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # This service sits behind exactly one Render reverse-proxy hop, which
      # appends the real client IP as the last entry of X-Forwarded-For
      # (nginx-style $proxy_add_x_forwarded_for — it appends, never
      # replaces). TRUSTED_PROXY_HOPS=1 tells app.rate_limit.get_client_ip to
      # trust only that last entry for IP-based rate limiting; everything
      # before it is attacker-controllable and ignored. Left at the default
      # of 0 (X-Forwarded-For ignored, request.client.host used) anywhere
      # this isn't explicitly set, e.g. local dev — see app/rate_limit.py.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Verbosity for every `logging.getLogger(__name__)` call in the app
      # (see app/main.py). Optional -- INFO is the code-level default.
      - key: LOG_LEVEL
        value: INFO
      # REQUIRED IN PRACTICE, even though nothing crashes without it: this
      # is the base URL every emailed link is built from (password reset,
      # email verification, public quote share links) AND the destination
      # the Google Sign-In callback redirects the browser back to (see
      # app/tokens.py, app/routers/auth.py). Left unset, it defaults to
      # http://localhost:3000 and every one of those links silently points
      # at the user's own machine instead of the deployed frontend. Set it
      # to the deployed frontend origin, e.g. https://your-app.vercel.app.
      - key: FRONTEND_BASE_URL
        sync: false
      # Outbound email (Resend). Both required together; without them the
      # app still starts and every non-email route works, but password
      # reset / verification / invitation / invoice / quote emails are
      # never actually delivered (send failures are swallowed by design --
      # see app/routers/auth.py's issue_password_reset).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Billing (Phase 17A/19). "none" (the code default) runs against
      # NullBillingProvider -- plan limits are still fully enforced,
      # nothing is ever charged, and the checkout/portal routes 503. Set
      # to "stripe" plus the two secrets below to enable real checkout.
      # See docs/billing_providers.md.
      - key: BILLING_PROVIDER
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Google Sign-In (Phase 25) -- disabled by default even with the
      # credentials set; GOOGLE_OAUTH_ENABLED is a separate explicit
      # opt-in. GOOGLE_REDIRECT_URI must EXACTLY match a redirect URI
      # registered on the Google Cloud OAuth client, and must be THIS
      # service's own public URL + /auth/google/callback. Password
      # login/registration are unaffected when this is left disabled.
      # See docs/google_auth.md.
      - key: GOOGLE_OAUTH_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # AI Business Assistant — optional, provider-agnostic (see
      # app/ai/factory.py). Without a valid provider configured, the
      # POST .../assistant/chat endpoint returns a clean 503 and nothing
      # else in the app is affected. AI_MODEL has NO fallback in production
      # (ENVIRONMENT=production, set above) — it must be set explicitly
      # here once you're ready to enable the assistant. See .env.example
      # for the full list of tunable AI_* limits.
      #
      # AI_PROVIDER selects which of the two keys below is actually used:
      # "anthropic" (default if unset) reads ANTHROPIC_API_KEY; "gemini"
      # reads GEMINI_API_KEY. Only set the key matching your chosen
      # provider — the other is never read. Leave AI_PROVIDER unset (or
      # "anthropic") to keep the assistant behaving exactly as before this
      # variable existed.
      - key: AI_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

# ==========================================================================
# BACKGROUND WORKER -- READ THIS BEFORE YOUR FIRST REAL DEPLOY.
# ==========================================================================
# Durable background-job worker (Phase 15C) -- executes EVERY job type
# registered in app.jobs.registry, claimed from the `background_jobs`
# table. Commented out because it is a second, ALWAYS-ON process, and
# Render's free tier supports exactly one free web service, not a second
# worker for free -- enabling it genuinely requires a paid plan (Render
# "Background Worker" service type). That is a cost decision only the
# operator can make, which is why this is left commented rather than
# enabled by default.
#
# WHAT SILENTLY DOES NOT WORK WITHOUT A RUNNING WORKER (as of Phase 24.3
# there are 5 job types, not just webhooks -- this list has grown since
# this block was first written):
#   - webhook.deliver / webhook.retry  -> outbound webhooks are durably
#     PERSISTED (every event/delivery row still commits transactionally,
#     see app.services.webhook_events) but never actually DELIVERED.
#   - notification.email               -> in-app notifications still
#     appear, but their EMAIL copies are never sent.
#   - financial_insight.generate       -> the AI Financial Advisor's
#     "Generate analysis" button leaves the report stuck in `pending`
#     FOREVER, with the UI polling a status that will never change. This
#     is the most user-visible consequence and did not exist when this
#     block was originally written.
#   - whatsapp.send_document           -> requested invoice/quote PDFs
#     are never delivered over WhatsApp.
#
# Everything else (invoicing, PDFs, dashboard, analytics, forecasting,
# auth) works completely normally with no worker running. If you deploy
# without one, treat the four features above as OFF, not as broken.
# See docs/production_readiness.md for the deploy-time decision.
#
# DELIBERATELY LEFT COMMENTED, NOT MERELY UNFINISHED: a Blueprint sync
# reads this file and CREATES what it declares, so uncommenting this block
# provisions a paid always-on service. That has to stay an explicit,
# deliberate action by the operator, never a side effect of editing config.
# Everything below is complete and correct as written -- uncommenting it
# (and nothing else) is the whole change.
#
# THE WORKER IS NOT JUST A DATABASE CONSUMER. It executes the handlers
# itself, so it needs the SAME provider configuration as the web service,
# not a subset. The email/AI variables below are not optional polish --
# without them the two most user-visible job types fail on every attempt:
#   notification.email          -> permanently_failed, error_code=
#                                  email_not_configured (verified locally)
#   financial_insight.generate  -> the job row succeeds but the report is
#                                  recorded `failed` with error_code=
#                                  ai_unavailable (verified locally)
# Note AI_PROVIDER defaults to "anthropic" when UNSET (app/ai/factory.py),
# so a worker that omits it while the web service sets "gemini" will read
# a key that isn't there and fail every report. Set it explicitly on BOTH.
# AI_MODEL has no fallback at all when ENVIRONMENT=production.
#
# services:
#   - type: worker
#     name: invoicing-worker
#     runtime: python
#     plan: starter
#     # region: <same one the invoicing-api service already runs in>
#     # -- omitted here rather than guessed; the web service above doesn't
#     # pin one either, so both currently take Render's default. Keep the
#     # worker in the API's region (and, ideally, the Neon database's) so
#     # every claim/complete round trip stays on a short network path.
#     buildCommand: pip install -r requirements.txt
#     startCommand: python -m app.jobs.worker
#     envVars:
#       - key: ENVIRONMENT
#         value: production
#       # THE SAME Neon connection string as the web service. Note the
#       # code default is `sqlite:///./invoices.db` (app/database.py), so a
#       # worker missing this does NOT crash -- it silently polls an empty
#       # local SQLite file forever and claims nothing. Always set it.
#       - key: DATABASE_URL
#         sync: false
#       # Reuse the web service's EXACT value. The worker never issues or
#       # verifies a token, but it imports app.security transitively (via
#       # app.ai.factory), and that module raises at IMPORT time when
#       # ENVIRONMENT=production and this is unset -- the worker would
#       # crash-loop on boot before claiming anything.
#       - key: JWT_SECRET_KEY
#         sync: false
#       - key: LOG_LEVEL
#         value: INFO
#       # Outbound email -- required for notification.email. Same values as
#       # the web service.
#       - key: RESEND_API_KEY
#         sync: false
#       - key: EMAIL_FROM
#         sync: false
#       # AI -- required for financial_insight.generate. Same values as the
#       # web service; set only the key matching AI_PROVIDER.
#       - key: AI_PROVIDER
#         sync: false
#       - key: AI_MODEL
#         sync: false
#       - key: ANTHROPIC_API_KEY
#         sync: false
#       - key: GEMINI_API_KEY
#         sync: false
#       # Only if WhatsApp is intentionally enabled -- whatsapp.send_document
#       # otherwise resolves to the null provider and permanently fails with
#       # error_code=whatsapp_not_configured. Omit all four when unused.
#       - key: WHATSAPP_ENABLED
#         sync: false
#       - key: WHATSAPP_PROVIDER
#         sync: false
#       - key: WHATSAPP_BRIDGE_URL
#         sync: false
#       - key: WHATSAPP_BRIDGE_SECRET
#         sync: false
#       # See app/job_config.py for the full list and defaults -- every one
#       # is optional; omit any you're happy leaving at its documented
#       # default.
#       - key: WORKER_QUEUE
#         value: default
#       - key: WORKER_POLL_INTERVAL_SECONDS
#         value: "2"
#       - key: WORKER_IDLE_BACKOFF_MAX_SECONDS
#         value: "30"
#       - key: WORKER_LEASE_DURATION_SECONDS
#         value: "300"
#       - key: WORKER_BATCH_SIZE
#         value: "5"
#
# NOT needed by the worker, deliberately omitted above: PORT/health checks
# (it opens no socket), a persistent disk (it holds no local state -- PDFs
# are re-rendered in memory from the database), CORS_ALLOWED_ORIGINS and
# TRUSTED_PROXY_HOPS (no HTTP surface), the Stripe and Google variables (no
# job type touches billing or OAuth), and FRONTEND_BASE_URL (no worker-
# reachable code path builds a link -- notification copy carries no URLs;
# set it anyway if you prefer the two processes to be configured
# identically). Multiple instances are safe on Postgres: claim_jobs uses
# SELECT ... FOR UPDATE SKIP LOCKED plus a conditional-UPDATE rowcount
# check, so a job is never double-owned (see app/services/background_jobs.py).
#
# Migration/deployment ordering: the web service's own FastAPI lifespan
# hook already runs app.models.init_db() (idempotent schema migrations,
# see app/schema_migrations.py) on every startup, so no separate migration
# step is needed before the worker starts -- deploy the web service first
# (or simultaneously; both call the same idempotent init_db()), then the
# worker. Running only the worker with a database that predates the
# background_jobs table would fail at the worker's own first query, so in
# practice always let at least one process's init_db() run before either
# claims work. Rollback: reverting the worker's own image/commit is always
# safe (jobs simply stop being claimed, none are lost -- see
# recover_abandoned_jobs); reverting the web service back to a pre-15C
# commit while pending 15C jobs still exist in the database is also safe
# (older code never reads the background_jobs table, so those rows are
# just inert until a 15C-or-later worker runs again), but any
# STILL-PENDING webhook deliveries from before the rollback won't be
# retried automatically until a 15C worker is running again.

# Payment reminders (app/jobs/send_due_invoice_reminders.py) run as a
# standalone CLI job, deliberately never inside the web service above and
# never exposed as an HTTP endpoint. This repo's concrete trigger is a
# scheduled GitHub Actions workflow instead (see
# .github/workflows/send-invoice-reminders.yml), since Render Cron Jobs
# require a paid plan and the web service above targets the free tier.
# If you upgrade, a Render Cron Job is an equally valid alternative -- add
# it as its own top-level resource alongside `services`, e.g.:
#
# cronJobs:
#   - type: cron
#     name: send-invoice-reminders
#     runtime: python
#     plan: starter
#     schedule: "0 12 * * *"  # once daily; adjust to your users' timezones
#     buildCommand: pip install -r requirements.txt
#     startCommand: python -m app.jobs.send_due_invoice_reminders
#     envVars:
#       - key: DATABASE_URL
#         sync: false
#       - key: RESEND_API_KEY
#         sync: false
#       - key: EMAIL_FROM
#         sync: false
